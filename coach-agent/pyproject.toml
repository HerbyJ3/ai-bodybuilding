[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-agent"
version = "0.1.0"
description = "Hypertrophy & physique coach agent: deterministic rules engine + event store"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "anthropic>=1.0",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
coach = "ingest.cli:app"

[tool.setuptools.packages.find]
include = ["config*", "schemas*", "store*", "engine*", "ingest*", "approvals*", "llm*", "evals*", "dashboard*"]

[tool.setuptools.package-data]
config = ["*.json"]
evals = ["*.yaml"]
dashboard = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
