<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mr. J{% endblock %}</title>
  <link rel="icon" href="{{ asset('logo') }}">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="{{ asset('logo') }}" alt="" width="32" height="32"><span>Mr. J</span></a>
    <nav><a href="/">Clients</a><a href="/onboard">Add client</a></nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <script src="/static/ui.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
